{% if products %}
<section class="featured-pick-rail" aria-label="Featured plants">
    <div class="featured-pick-rail__shell">
        {% with va=view_all_url|default:banner_link %}
        {% if va %}
        <div class="storefront-section-actions">
            <a href="{{ va }}" class="link-view-all">View all</a>
        </div>
        {% endif %}
        {% endwith %}
        <header class="storefront-section-heading">
            <h2 class="storefront-section-heading__title">Our pick for you</h2>
        </header>
        <div class="featured-pick-rail__rail">
            <div
                class="owl-carousel featured-pick-rail__carousel"
                data-rail-count="{{ products|length }}">
                {% for product in products %}
                <div class="featured-pick-rail__slide">
                    {% include "partials/_storefront_rail_product_card.html" with product=product %}
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</section>
{% endif %}
