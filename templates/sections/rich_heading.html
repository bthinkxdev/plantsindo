
<section class="p99-rich-band {% if modifier %}{{ modifier }}{% endif %}" {% if section_id %}id="{{ section_id }}"{% endif %}>
    <div class="p99-rich-band__inner">
        {% if kicker %}<p class="p99-rich-band__kicker">{{ kicker }}</p>{% endif %}
        <h2 class="p99-rich-band__title">{{ title }}</h2>
        {% if subtitle %}<p class="p99-rich-band__sub">{{ subtitle }}</p>{% endif %}
        {% if cta_label and cta_url %}
        <a href="{{ cta_url }}" class="btn-store btn-store--light p99-rich-band__cta">{{ cta_label }}</a>
        {% endif %}
    </div>
</section>
