{% if products %}
<section class="deal-of-the-day" aria-label="Deal of the day">
    <div class="deal-of-the-day__shell">
        {% with va=view_all_url|default:banner_link %}
        {% if va %}
        <div class="storefront-section-actions">
            <a href="{{ va }}" class="link-view-all">View all</a>
        </div>
        {% endif %}
        {% endwith %}
        <header class="storefront-section-heading">
            <h2 class="storefront-section-heading__title">Deal of the day</h2>
        </header>
        <div class="deal-of-the-day__rail">
            <div
                class="owl-carousel deal-of-the-day__carousel"
                data-rail-count="{{ products|length }}">
                {% for product in products %}
                <div class="deal-of-the-day__slide">
                    {% include "partials/_storefront_rail_product_card.html" with product=product %}
                </div>
                {% endfor %}
            </div>
        </div>
        <div class="deal-of-the-day__timer" aria-label="Time remaining until midnight">
            <span class="deal-of-the-day__timer-label">Ends today in</span>
            <div class="deal-of-the-day__timer-clock" aria-hidden="true">
                <div class="deal-of-the-day__timer-seg">
                    <span class="deal-of-the-day__timer-num" data-ddh>00</span>
                    <span class="deal-of-the-day__timer-unit">h</span>
                </div>
                <span class="deal-of-the-day__timer-sep">:</span>
                <div class="deal-of-the-day__timer-seg">
                    <span class="deal-of-the-day__timer-num" data-ddm>00</span>
                    <span class="deal-of-the-day__timer-unit">m</span>
                </div>
                <span class="deal-of-the-day__timer-sep">:</span>
                <div class="deal-of-the-day__timer-seg">
                    <span class="deal-of-the-day__timer-num" data-dds>00</span>
                    <span class="deal-of-the-day__timer-unit">s</span>
                </div>
            </div>
        </div>
    </div>
</section>
{% endif %}
