<script>
(function(){
    // Legacy attribute-driven logic (kept for reference) is disabled.
    // New variant-driven implementation is added in a separate script block below.
    return;
    var variantData = {};
    var mainImg = document.getElementById('mainProductImg');
    var formVariantId = document.getElementById('formVariantId');
    var priceBlock = document.getElementById('productPriceBlock');
    var qtyInput = document.getElementById('qtyInput');
    var formQuantity = document.getElementById('formQuantity');
    if (!qtyInput) return;
    document.querySelectorAll('.gallery-thumb img').forEach(function(thumb){
        thumb.addEventListener('click', function(){
            var src = this.getAttribute('data-full') || this.src;
            if(mainImg) mainImg.src = src;
            document.querySelectorAll('.gallery-thumb').forEach(function(t){ t.classList.remove('active'); });
            thumb.closest('.gallery-thumb').classList.add('active');
        });
    });
    document.querySelectorAll('.variant-option[data-variant-id]').forEach(function(opt){
        var vid = opt.getAttribute('data-variant-id');
        if(!vid) return;
        opt.addEventListener('click', function(e){ e.preventDefault(); window.location.href = '?variant=' + vid; });
    });
    // Attribute-based variant resolution
    var attrGroups = document.getElementById('variantAttributeGroups');
    var productId = {{ product.id|default:0 }};
    if (attrGroups && productId) {
        var attributeGroups = Array.prototype.slice.call(
            attrGroups.querySelectorAll('[data-attribute-id]')
        );

        function getSelectedValueIds() {
            var ids = [];
            attributeGroups.forEach(function(group){
                var selected = group.querySelector('.attribute-value-btn.btn-dark');
                if (selected && !selected.disabled) {
                    var id = selected.getAttribute('data-attribute-value-id');
                    if (id) ids.push(parseInt(id, 10));
                }
            });
            return ids;
        }

        function recomputeAvailability() {
            if (!variantData) return;
            // Map current selection per attribute group
            var selectedPerGroup = {};
            attributeGroups.forEach(function(group){
                var attrId = group.getAttribute('data-attribute-id');
                var selected = group.querySelector('.attribute-value-btn.btn-dark');
                selectedPerGroup[attrId] = selected && !selected.disabled
                    ? selected.getAttribute('data-attribute-value-id')
                    : null;
            });

            attributeGroups.forEach(function(group){
                var attrId = group.getAttribute('data-attribute-id');
                var buttons = group.querySelectorAll('.attribute-value-btn');
                Array.prototype.forEach.call(buttons, function(btn){
                    var valId = btn.getAttribute('data-attribute-value-id');
                    if (!valId) return;
                    var valIdNum = parseInt(valId, 10);
                    var enabled = false;

                    outer: for (var vid in variantData) {
                        if (!Object.prototype.hasOwnProperty.call(variantData, vid)) continue;
                        var v = variantData[vid];
                        if (!v.in_stock) continue;
                        var vIds = v.attribute_value_ids || [];
                        if (vIds.indexOf(valIdNum) === -1) continue;
                        // Check other attributes' selections match this variant
                        for (var i = 0; i < attributeGroups.length; i++) {
                            var otherGroup = attributeGroups[i];
                            var otherAttrId = otherGroup.getAttribute('data-attribute-id');
                            if (otherAttrId === attrId) continue;
                            var selectedVal = selectedPerGroup[otherAttrId];
                            if (selectedVal && vIds.indexOf(parseInt(selectedVal, 10)) === -1) {
                                continue outer;
                            }
                        }
                        enabled = true;
                        break outer;
                    }

                    if (enabled) {
                        btn.disabled = false;
                        btn.classList.remove('disabled-option');
                    } else {
                        btn.disabled = true;
                        btn.classList.add('disabled-option');
                        btn.classList.remove('btn-dark');
                        if (!btn.classList.contains('btn-outline-dark')) {
                            btn.classList.add('btn-outline-dark');
                        }
                    }
                });
            });
        }
        function handleVariantUnavailable() {
            if (priceBlock) {
                priceBlock.innerHTML = '';
            }
            if (formVariantId) {
                formVariantId.value = '';
            }
            var stockEl = document.querySelector('.stock-indicator');
            if (stockEl) {
                stockEl.innerHTML = '<i class="fas fa-times-circle me-1" style="color:#c00;"></i> Not available in this combination';
            }
            var addBtn = document.querySelector('.btn-add-cart');
            if (addBtn) addBtn.disabled = true;
            var buyNowBtn = document.getElementById('buyNowBtn');
            if (buyNowBtn) buyNowBtn.disabled = true;
        }
        function updateUIFromVariant(data) {
            if (!data || !data.variant) return;
            var v = data.variant;
            if (priceBlock) priceBlock.innerHTML = '<span class="price-main">&#8377;' + parseFloat(v.price).toFixed(0) + '</span>';
            if (formVariantId) formVariantId.value = v.id;
            var stockEl = document.querySelector('.stock-indicator');
            if (stockEl) stockEl.innerHTML = v.in_stock
                ? '<i class="fas fa-check-circle me-1" style="color:#000;"></i> In Stock (' + v.stock_quantity + ')'
                : '<i class="fas fa-times-circle me-1" style="color:#c00;"></i> Out of Stock';
            var addBtn = document.querySelector('.btn-add-cart');
            if (addBtn) addBtn.disabled = !v.in_stock;
            var buyNowBtn = document.getElementById('buyNowBtn');
            if (buyNowBtn) buyNowBtn.disabled = !v.in_stock;
            var wishBtn = document.getElementById('productWishlistBtn');
            if (wishBtn) wishBtn.setAttribute('data-variant-id', v.id);
            if (mainImg && v.image_urls && v.image_urls[0]) mainImg.src = v.image_urls[0];
            var thumbs = document.querySelector('.gallery-thumbs');
            if (thumbs && v.image_urls && v.image_urls.length) {
                thumbs.innerHTML = v.image_urls.map(function(url, i){
                    return '<div class="gallery-thumb' + (i === 0 ? ' active' : '') + '"><img src="' + url + '" alt="" loading="lazy" data-full="' + url + '"></div>';
                }).join('');
            }
        }

        // Initial availability calculation based on current selection
        recomputeAvailability();

        attrGroups.querySelectorAll('.attribute-value-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
                if (btn.disabled) return;
                var groupEl = btn.closest('[data-attribute-id]');
                var attrId = groupEl.getAttribute('data-attribute-id');
                // Update selection in this group
                groupEl.querySelectorAll('.attribute-value-btn').forEach(function(b){
                    b.classList.remove('btn-dark');
                    if (!b.classList.contains('disabled-option')) {
                        b.classList.add('btn-outline-dark');
                    }
                });
                btn.classList.remove('btn-outline-dark'); btn.classList.add('btn-dark');
                // Clear selections in other groups so we can freely change attribute,
                // then recompute availability based only on the new partial selection.
                attributeGroups.forEach(function(otherGroup){
                    if (otherGroup === groupEl) return;
                    otherGroup.querySelectorAll('.attribute-value-btn').forEach(function(b){
                        b.classList.remove('btn-dark');
                        if (!b.classList.contains('disabled-option')) {
                            b.classList.add('btn-outline-dark');
                        }
                    });
                });
                // Recompute which options are available now
                recomputeAvailability();
                // Recompute which options are available for other attributes
                var ids = getSelectedValueIds();
                if (ids.length !== attributeGroups.length) {
                    // Wait until user selects all attributes before resolving variant
                    var stockEl = document.querySelector('.stock-indicator');
                    if (stockEl) {
                        stockEl.innerHTML = '<i class="fas fa-info-circle me-1" style="color:#000;"></i> Select all options to see availability';
                    }
                    var addBtn = document.querySelector('.btn-add-cart');
                    if (addBtn) addBtn.disabled = true;
                    var buyNowBtn = document.getElementById('buyNowBtn');
                    if (buyNowBtn) buyNowBtn.disabled = true;
                    return;
                }
                fetch('{% url "store:product_variant_resolve" %}?product_id=' + productId + '&attribute_value_ids=' + ids.join(','), { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
                    .then(function(r){ return r.json(); })
                    .then(function(data){
                        if (data && data.success) {
                            updateUIFromVariant(data);
                        } else {
                            handleVariantUnavailable();
                        }
                    })
                    .catch(function(){
                        handleVariantUnavailable();
                    });
            });
        });
    }
    // Buy Now: submit same form to buy-now endpoint (cart is replaced with this item only, then checkout)
    var buyNowBtn = document.getElementById('buyNowBtn');
    var addToCartForm = document.getElementById('addToCartForm');
    var buyNowUrl = '{% url "store:buy_now" %}';
    if (buyNowBtn && addToCartForm) {
        buyNowBtn.addEventListener('click', function(){
            if (buyNowBtn.disabled) return;
            var vid = formVariantId ? formVariantId.value : '';
            if (!vid || vid === '') {
                alert('Please select a variant.');
                return;
            }
            addToCartForm.action = buyNowUrl;
            addToCartForm.submit();
        });
    }
    // (Wishlist handled in the active script block below)
    {% if REVIEW_ENABLED %}
    // Review Form
    var reviewForm = document.getElementById('reviewForm');
    if (reviewForm) {
        var stars = reviewForm.querySelectorAll('.star-btn');
        var ratingInput = document.getElementById('reviewRating');
        stars.forEach(function(btn){
            btn.addEventListener('mouseenter', function(){
                var hoverVal = parseInt(btn.getAttribute('data-value'));
                stars.forEach(function(b){
                    b.style.color = parseInt(b.getAttribute('data-value')) <= hoverVal ? '#f5a623' : '#ddd';
                });
            });
            btn.addEventListener('mouseleave', function(){
                var selected = ratingInput.value ? parseInt(ratingInput.value) : 0;
                stars.forEach(function(b){
                    b.style.color = parseInt(b.getAttribute('data-value')) <= selected ? '#f5a623' : '#ddd';
                });
            });
            btn.addEventListener('click', function(){
                var val = parseInt(btn.getAttribute('data-value'));
                ratingInput.value = val;
                stars.forEach(function(b){
                    b.style.color = parseInt(b.getAttribute('data-value')) <= val ? '#f5a623' : '#ddd';
                });
            });
        });
        reviewForm.addEventListener('submit', function(e){
            e.preventDefault();
            if (!ratingInput.value) {
                document.getElementById('reviewMsg').style.color = 'red';
                document.getElementById('reviewMsg').textContent = 'Please select a rating.';
                return;
            }
            var submitBtn = document.getElementById('reviewSubmitBtn');
            var msg = document.getElementById('reviewMsg');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            fetch(reviewForm.action, {
                method: 'POST',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: new FormData(reviewForm)
            })
            .then(function(r){ return r.json(); })
            .then(function(data){
                if (data.success) {
                    msg.style.color = 'green';
                    msg.textContent = data.message || 'Review submitted!';
                    setTimeout(function(){ location.reload(); }, 1200);
                } else {
                    msg.style.color = 'red';
                    msg.textContent = data.error || 'Something went wrong.';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Review';
                }
            })
            .catch(function(){
                msg.style.color = 'red';
                msg.textContent = 'Network error. Please try again.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Review';
            });
        });
    }
    {% endif %}
})();
</script>

<script>
(function(){
    // --- Variant-driven product detail logic (strict top-down hierarchy) ---
    var variantJsonEl = document.getElementById('variant-data');
    var orderedAttrsEl = document.getElementById('ordered-attributes');
    var variants = [];
    var orderedAttributeNames = [];

    if (variantJsonEl) {
        try {
            variants = JSON.parse(variantJsonEl.textContent || '[]') || [];
        } catch (e) {
            variants = [];
        }
    }
    if (orderedAttrsEl) {
        try {
            orderedAttributeNames = JSON.parse(orderedAttrsEl.textContent || '[]') || [];
        } catch (e) {
            orderedAttributeNames = [];
        }
    }

    var mainImg = document.getElementById('mainProductImg');
    var formVariantId = document.getElementById('formVariantId');
    var priceBlock = document.getElementById('productPriceBlock');
    var stockEl = document.querySelector('.stock-indicator');
    var addBtn = document.querySelector('.btn-add-cart');
    var buyNowBtn = document.getElementById('buyNowBtn');
    var wishlistBtn = document.getElementById('productWishlistBtn');
    var addToCartForm = document.getElementById('addToCartForm');
    var isSimpleProduct = addToCartForm && addToCartForm.getAttribute('data-simple-product') === 'true';
    var buyNowUrl = '{% url "store:buy_now" %}';

    var qtyInput = document.getElementById('qtyInput');
    var formQuantity = document.getElementById('formQuantity');

    // Gallery thumbs
    document.querySelectorAll('.gallery-thumb img').forEach(function(thumb){
        thumb.addEventListener('click', function(){
            var src = this.getAttribute('data-full') || this.src;
            if (mainImg && src) {
                mainImg.src = src;
            }
            document.querySelectorAll('.gallery-thumb').forEach(function(t){ t.classList.remove('active'); });
            var parent = thumb.closest('.gallery-thumb');
            if (parent) parent.classList.add('active');
        });
    });

    

    // Attribute groups and selection state (DOM order defines level order)
    var attrGroupsRoot = document.getElementById('variantAttributeGroups');
    var attributeGroups = [];
    if (attrGroupsRoot) {
        attributeGroups = Array.prototype.slice.call(
            attrGroupsRoot.querySelectorAll('[data-attribute-name]')
        );
    }

    // Selected attributes: { "Color": "Blue", "Size": "XL" }
    var selected = {};
    var currentVariant = null;

    /** Match variant.attributes keys to DOM data-attribute-name (same as resolveVariantFromSelection). */
    function variantAttrValue(variant, attrName) {
        if (!variant || !variant.attributes || !attrName) return null;
        var attrs = variant.attributes;
        if (Object.prototype.hasOwnProperty.call(attrs, attrName)) {
            return attrs[attrName];
        }
        var want = String(attrName).toLowerCase();
        var keys = Object.keys(attrs);
        for (var i = 0; i < keys.length; i++) {
            if (String(keys[i]).toLowerCase() === want) {
                return attrs[keys[i]];
            }
        }
        return null;
    }

    /** Compare attribute display values from DB vs data-attribute-value (trim + case-insensitive). */
    function attrValuesEqual(a, b) {
        if (a == null || b == null) return false;
        return String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
    }

    function normalizeAttrValKey(v) {
        return String(v == null ? '' : v).trim().toLowerCase();
    }

    function resolveVariantFromDomIds() {
        if (!variants.length || !attributeGroups.length) return null;
        var wantIds = [];
        for (var i = 0; i < attributeGroups.length; i++) {
            var group = attributeGroups[i];
            var sel = group.querySelector('.attribute-value-btn.btn-dark');
            if (!sel || sel.classList.contains('disabled-option')) return null;
            var idRaw = sel.getAttribute('data-attribute-value-id');
            var idNum = idRaw ? parseInt(idRaw, 10) : 0;
            if (!idNum) return null;
            wantIds.push(idNum);
        }
        wantIds.sort(function(a, b){ return a - b; });
        for (var j = 0; j < variants.length; j++) {
            var v = variants[j];
            if (!v || !v.attribute_value_ids || !v.attribute_value_ids.length) continue;
            var got = v.attribute_value_ids.slice().sort(function(a, b){ return a - b; });
            if (got.length !== wantIds.length) continue;
            var same = true;
            for (var k = 0; k < wantIds.length; k++) {
                if (got[k] !== wantIds[k]) { same = false; break; }
            }
            if (same) return v;
        }
        return null;
    }

    function setStockMessage(message, kind) {
        if (!stockEl) return;
        if (kind === 'out') {
            stockEl.innerHTML = '<i class="fas fa-times-circle me-1" style="color:#c00;"></i> ' + message;
        } else if (kind === 'info') {
            stockEl.innerHTML = '<i class="fas fa-info-circle me-1" style="color:#000;"></i> ' + message;
        } else if (kind === 'ok') {
            stockEl.innerHTML = '<i class="fas fa-check-circle me-1" style="color:#000;"></i> ' + message;
        } else {
            stockEl.textContent = message;
        }
    }

    function applyVariant(variant) {
        currentVariant = variant || null;
        if (!variant) {
            if (priceBlock) {
                priceBlock.innerHTML = '<div class="text-muted small mb-0" id="pdp-price-pending">Select options to see price and availability.</div>';
            }
            if (formVariantId) {
                formVariantId.value = '';
            }
            if (addBtn) {
                addBtn.disabled = true;
            }
            if (buyNowBtn) {
                buyNowBtn.disabled = true;
            }
            if (wishlistBtn) {
                wishlistBtn.removeAttribute('data-variant-id');
            }
            setStockMessage('Select all options to see availability', 'info');
            return;
        }

        if (priceBlock) {
            var priceNumber = parseFloat(variant.price || '0');
            var gstApplicable = variant.is_gst_applicable && variant.gst_percentage != null;
            var gstPct = gstApplicable ? parseFloat(variant.gst_percentage) : 0;
            if (gstApplicable && !isNaN(gstPct) && gstPct >= 0 && gstPct <= 28) {
                var base = priceNumber;
                var gstAmount = Math.round(base * gstPct / 100 * 100) / 100;
                var total = Math.round((base + gstAmount) * 100) / 100;
                var origPriceG = variant.original_price ? parseFloat(variant.original_price) : 0;
                var discPctG = variant.discount_percent || 0;
                var hasDiscountG = origPriceG > 0 && origPriceG > base;
                var mrpRow = '';
                if (hasDiscountG) {
                    mrpRow = '<div style="margin-bottom:.35rem;"><span class="price-mrp">&#8377;' + origPriceG.toFixed(0) + '</span>';
                    if (discPctG > 0) {
                        mrpRow += ' <span class="price-off-badge">' + discPctG + '% OFF</span>';
                    }
                    mrpRow += '</div>';
                }
                priceBlock.innerHTML = '<div class="price-breakdown">' + mrpRow +
                    '<div>Base Price: <span class="price-main">&#8377;' + base.toFixed(2) + '</span></div>' +
                    '<div>GST (' + gstPct + '%): <span class="price-gst">&#8377;' + gstAmount.toFixed(2) + '</span></div>' +
                    '<div class="price-total-line">Total: <span class="price-main">&#8377;' + total.toFixed(2) + '</span></div>' +
                    '</div>';
            } else {
                var priceText = isNaN(priceNumber) ? variant.price : priceNumber.toFixed(0);
                var origPrice = variant.original_price ? parseFloat(variant.original_price) : 0;
                var discPct   = variant.discount_percent || 0;
                var hasDiscount = origPrice > 0 && origPrice > priceNumber;

                // Update individual elements if they exist (avoids innerHTML flash)
                var mrpEl   = document.getElementById('price-mrp');
                var sellEl  = document.getElementById('price-selling');
                var badgeEl = document.getElementById('price-badge');

                if (sellEl) {
                    // Elements exist — update in place (no flicker)
                    sellEl.textContent = '\u20B9' + priceText;
                    if (hasDiscount) {
                        if (mrpEl)   { mrpEl.textContent = '\u20B9' + origPrice.toFixed(0); mrpEl.style.display = ''; }
                        if (badgeEl && discPct > 0) { badgeEl.textContent = discPct + '% OFF'; badgeEl.style.display = ''; }
                        else if (badgeEl) { badgeEl.style.display = 'none'; }
                    } else {
                        if (mrpEl)   mrpEl.style.display = 'none';
                        if (badgeEl) badgeEl.style.display = 'none';
                    }
                } else {
                    // Fallback: build innerHTML from scratch
                    var html = '<div class="price-block">';
                    if (hasDiscount) {
                        html += '<span class="price-mrp" id="price-mrp">&#8377;' + origPrice.toFixed(0) + '</span>';
                    } else {
                        html += '<span class="price-mrp" id="price-mrp" style="display:none;"></span>';
                    }
                    html += '<span class="price-main price-selling" id="price-selling">&#8377;' + priceText + '</span>';
                    if (hasDiscount && discPct > 0) {
                        html += '<span class="price-off-badge" id="price-badge">' + discPct + '% OFF</span>';
                    } else {
                        html += '<span class="price-off-badge" id="price-badge" style="display:none;"></span>';
                    }
                    html += '</div>';
                    priceBlock.innerHTML = html;
                }
            }
        }

        if (formVariantId) {
            formVariantId.value = variant.id;
        }

        var inStock = ((variant.stock != null ? variant.stock : variant.stock_quantity) || 0) > 0;
        
        var pdpMainCartBtn = document.getElementById('pdpMainCartBtn');
        if (pdpMainCartBtn && window.cartVariantIds) {
            if (window.cartVariantIds.includes(String(variant.id))) {
                pdpMainCartBtn.className = "btn-add-cart btn btn-view-cart";
                pdpMainCartBtn.innerHTML = '<span class="btn-add-cart-text"><i class="fas fa-shopping-cart me-2"></i> View Cart</span>';
                pdpMainCartBtn.disabled = false;
            } else {
                pdpMainCartBtn.className = "btn-add-cart btn js-pdp-add-cart";
                pdpMainCartBtn.innerHTML = '<span class="btn-add-cart-text"><i class="fas fa-shopping-bag me-2"></i> Add to Cart</span>';
                pdpMainCartBtn.disabled = !inStock;
            }
        } else if (addBtn) {
            addBtn.disabled = !inStock;
        }

        if (buyNowBtn) {
            buyNowBtn.disabled = !inStock;
        }

        if (wishlistBtn) {
            wishlistBtn.setAttribute('data-variant-id', String(variant.id));
            wishlistBtn.removeAttribute('data-product-id');
        }

        var sq = variant.stock != null ? variant.stock : variant.stock_quantity;
        if (inStock) {
            setStockMessage('In Stock (' + sq + ')', 'ok');
        } else {
            setStockMessage('Out of Stock', 'out');
        }

        if (qtyInput) {
            qtyInput.setAttribute('max', sq);
            if (parseInt(qtyInput.value, 10) > sq) {
                qtyInput.value = Math.max(1, sq);
            }
            qtyInput.dispatchEvent(new Event('change', { bubbles: true }));
        }

        if (mainImg && variant.image) {
            mainImg.src = variant.image;
        }
        if (typeof syncStickyFromDom === 'function') syncStickyFromDom();
        if (typeof window.pdpUpdatePotTotal === 'function') window.pdpUpdatePotTotal()
    }

    function matchesSelectionUpToLevel(variant, levelIndex) {
        if (!variant || !variant.attributes) return false;
        for (var i = 0; i < levelIndex; i++) {
            var group = attributeGroups[i];
            var attrName = group.getAttribute('data-attribute-name');
            var selVal = selected[attrName];
            if (!selVal) {
                return false;
            }
            var vKeys = Object.keys(variant.attributes);
            var matched = false;
            for (var k = 0; k < vKeys.length; k++) {
                if (vKeys[k].toLowerCase() === attrName.toLowerCase() && attrValuesEqual(variant.attributes[vKeys[k]], selVal)) {
                    matched = true;
                    break;
                }
            }
            if (!matched) return false;
        }
        return true;
    }

    // Check if we have a value selected for every attribute level
    function isFullSelection() {
        if (!attributeGroups.length) return true;
        for (var i = 0; i < attributeGroups.length; i++) {
            var group = attributeGroups[i];
            var name = group.getAttribute('data-attribute-name');
            if (!name || !selected[name]) {
                return false;
            }
        }
        return true;
    }

    // Resolve the first variant that exactly matches the current full selection
    function resolveVariantFromSelection() {
        if (!variants.length || !attributeGroups.length) {
            return null;
        }
        for (var vIdx = 0; vIdx < variants.length; vIdx++) {
            var v = variants[vIdx];
            if (!v || !v.attributes) continue;
            var ok = true;
            for (var i = 0; i < attributeGroups.length; i++) {
                var group = attributeGroups[i];
                var attrName = group.getAttribute('data-attribute-name');
                if (!attrName) { ok = false; break; }
                var val = selected[attrName];
                if (!val) { ok = false; break; }
                // Case-insensitive key lookup in variant attributes
                var vAttrKeys = Object.keys(v.attributes);
                var matchedKey = null;
                for (var k = 0; k < vAttrKeys.length; k++) {
                    if (vAttrKeys[k].toLowerCase() === attrName.toLowerCase()) {
                        matchedKey = vAttrKeys[k];
                        break;
                    }
                }
                if (!matchedKey || !attrValuesEqual(v.attributes[matchedKey], val)) {
                    ok = false;
                    break;
                }
            }
            if (ok) return v;
        }
        return null;
    }

    // Clear selections and visual state for all levels below the given index
    function clearLowerSelections(startLevelIndex) {
        for (var i = startLevelIndex; i < attributeGroups.length; i++) {
            var group = attributeGroups[i];
            var name = group.getAttribute('data-attribute-name');
            if (name && selected[name]) {
                delete selected[name];
            }
            group.querySelectorAll('.attribute-value-btn').forEach(function(btn){
                btn.classList.remove('btn-dark');
                if (!btn.classList.contains('disabled-option')) {
                    btn.classList.add('btn-outline-dark');
                }
                // Disabled state will be recomputed during cascade
            });
        }
    }

    // Auto-select the FIRST valid value at a given level based on current upper selections
    function autoSelectAtLevel(levelIndex) {
        if (!variants.length || !attributeGroups.length) {
            return false;
        }

        var group = attributeGroups[levelIndex];
        if (!group) return false;
        var attrName = group.getAttribute('data-attribute-name');
        if (!attrName) return false;

        var buttons = Array.prototype.slice.call(
            group.querySelectorAll('.attribute-value-btn')
        );

        // All previous levels must have a selection
        if (levelIndex > 0) {
            for (var i = 0; i < levelIndex; i++) {
                var prevName = attributeGroups[i].getAttribute('data-attribute-name');
                if (!prevName || !selected[prevName]) {
                    // Cannot compute this level yet
                    buttons.forEach(function(btn){
                        btn.disabled = true;
                        btn.classList.add('disabled-option');
                        btn.classList.remove('btn-dark');
                        if (!btn.classList.contains('btn-outline-dark')) {
                            btn.classList.add('btn-outline-dark');
                        }
                    });
                    if (selected[attrName]) {
                        delete selected[attrName];
                    }
                    return false;
                }
            }
        }

        // Filter variants that respect all previously selected attributes (0..levelIndex-1)
        var filteredVariants = variants.filter(function(v){
            return matchesSelectionUpToLevel(v, levelIndex);
        });

        if (!filteredVariants.length) {
            // No variants reachable at this level for current upper selection
            buttons.forEach(function(btn){
                btn.disabled = true;
                btn.classList.add('disabled-option');
                btn.classList.remove('btn-dark');
                if (!btn.classList.contains('btn-outline-dark')) {
                    btn.classList.add('btn-outline-dark');
                }
            });
            if (selected[attrName]) {
                delete selected[attrName];
            }
            return false;
        }

        // Collect allowed values for this attribute from filtered variants
        var allowedNorm = new Set();
        filteredVariants.forEach(function(v){
            var val = variantAttrValue(v, attrName);
            if (val != null && String(val).trim() !== '') allowedNorm.add(normalizeAttrValKey(val));
        });

        var firstEnabledBtn = null;
        buttons.forEach(function(btn){
            var value = btn.getAttribute('data-attribute-value');
            if (!value) return;
            var isAllowed = allowedNorm.has(normalizeAttrValKey(value));
            if (isAllowed) {
                btn.disabled = false;
                btn.classList.remove('disabled-option');
                if (!firstEnabledBtn) {
                    firstEnabledBtn = btn;
                }
            } else {
                btn.disabled = true;
                btn.classList.add('disabled-option');
                if (btn.classList.contains('btn-dark')) {
                    btn.classList.remove('btn-dark');
                    if (!btn.classList.contains('btn-outline-dark')) {
                        btn.classList.add('btn-outline-dark');
                    }
                    if (selected[attrName] === value) {
                        delete selected[attrName];
                    }
                }
            }
        });

        if (!firstEnabledBtn) {
            // No child values available at this level
            if (selected[attrName]) {
                delete selected[attrName];
            }
            return false;
        }

        // Auto-select the first valid value (DOM/display_order)
        group.querySelectorAll('.attribute-value-btn').forEach(function(b){
            b.classList.remove('btn-dark');
            if (!b.classList.contains('disabled-option')) {
                b.classList.add('btn-outline-dark');
            }
        });
        firstEnabledBtn.classList.remove('btn-outline-dark');
        firstEnabledBtn.classList.add('btn-dark');
        var firstVal = firstEnabledBtn.getAttribute('data-attribute-value');
        selected[attrName] = firstVal;

        return true;
    }

    // Cascade from a given level downwards, auto-selecting children and resolving the variant
    function cascadeFrom(startLevelIndex) {
        if (!variants.length) {
            applyVariant(null);
            return;
        }

        if (!attributeGroups.length) {
            // No attributes: just use the first sellable variant
            applyVariant(variants[0]);
            return;
        }

        if (startLevelIndex < 0) {
            startLevelIndex = 0;
        }

        for (var level = startLevelIndex; level < attributeGroups.length; level++) {
            var ok = autoSelectAtLevel(level);
            if (!ok) {
                break;
            }
        }

        if (isFullSelection()) {
            var resolved = resolveVariantFromSelection();
            if (!resolved) resolved = resolveVariantFromDomIds();
            if (!resolved && formVariantId) {
                var vidC = parseInt(formVariantId.value || '0', 10);
                if (vidC) resolved = variants.find(function(v){ return v.id === vidC; }) || null;
            }
            applyVariant(resolved);
        } else {
            // No complete in-stock path from current upper selections
            applyVariant(null);
        }
    }

    function tryResolveFinalVariant() {
        if (!variants.length) {
            applyVariant(null);
            setStockMessage('Out of Stock', 'out');
            return;
        }

        if (!attributeGroups.length) {
            // Product without attributes: first sellable variant
            applyVariant(variants[0]);
            return;
        }

        // Check full selection
        for (var i = 0; i < attributeGroups.length; i++) {
            var name = attributeGroups[i].getAttribute('data-attribute-name');
            if (!name || !selected[name]) {
                // Not fully selected yet
                applyVariant(null);
                setStockMessage('Select all options to see availability', 'info');
                return;
            }
        }

        var matches = variants.filter(function(v){
            for (var i = 0; i < attributeGroups.length; i++) {
                var g = attributeGroups[i];
                var attrName = g.getAttribute('data-attribute-name');
                var val = selected[attrName];
                if (!val) return false;
                if (!attrValuesEqual(variantAttrValue(v, attrName), val)) return false;
            }
            return true;
        });

        if (!matches.length) {
            applyVariant(null);
            return;
        }

        // When multiple match, pick the first sellable (all are sellable by construction)
        applyVariant(matches[0]);
    }

    function disableLevelsFrom(startLevelIndex) {
        for (var i = startLevelIndex; i < attributeGroups.length; i++) {
            var group = attributeGroups[i];
            var buttons = group.querySelectorAll('.attribute-value-btn');
            buttons.forEach(function(btn){
                btn.classList.remove('btn-dark');
                if (!btn.classList.contains('btn-outline-dark')) {
                    btn.classList.add('btn-outline-dark');
                }
                btn.disabled = true;
                btn.classList.add('disabled-option');
            });
            var name = group.getAttribute('data-attribute-name');
            if (name && selected[name]) {
                delete selected[name];
            }
        }
    }

    // Core: update a specific level based on STRICT top-down rules
    function updateLevel(levelIndex) {
        if (!variants.length || !attributeGroups.length) {
            return;
        }

        var group = attributeGroups[levelIndex];
        if (!group) return;
        var attrName = group.getAttribute('data-attribute-name');
        if (!attrName) return;

        var buttons = Array.prototype.slice.call(
            group.querySelectorAll('.attribute-value-btn')
        );

        var filteredVariants;
        if (levelIndex === 0) {
            // LEVEL 0: independent, based only on existence of any sellable variant
            filteredVariants = variants.slice();
        } else {
            // LEVEL N: only enabled after all previous levels selected
            for (var i = 0; i < levelIndex; i++) {
                var prevName = attributeGroups[i].getAttribute('data-attribute-name');
                if (!prevName || !selected[prevName]) {
                    // Previous level not selected â‡’ disable everything at this level
                    buttons.forEach(function(btn){
                        btn.disabled = true;
                        btn.classList.add('disabled-option');
                        btn.classList.remove('btn-dark');
                        if (!btn.classList.contains('btn-outline-dark')) {
                            btn.classList.add('btn-outline-dark');
                        }
                    });
                    if (selected[attrName]) {
                        delete selected[attrName];
                    }
                    return;
                }
            }
            filteredVariants = variants.filter(function(v){
                return matchesSelectionUpToLevel(v, levelIndex);
            });
        }

        if (!filteredVariants.length) {
            // No variants reachable at this level for current upper selection
            buttons.forEach(function(btn){
                btn.disabled = true;
                btn.classList.add('disabled-option');
                btn.classList.remove('btn-dark');
                if (!btn.classList.contains('btn-outline-dark')) {
                    btn.classList.add('btn-outline-dark');
                }
            });
            if (selected[attrName]) {
                delete selected[attrName];
            }
            return;
        }

        // Collect allowed values for this attribute from filtered variants
        var allowedNorm = new Set();
        filteredVariants.forEach(function(v){
            var val = variantAttrValue(v, attrName);
            if (val != null && String(val).trim() !== '') allowedNorm.add(normalizeAttrValKey(val));
        });

        buttons.forEach(function(btn){
            var value = btn.getAttribute('data-attribute-value');
            if (!value) return;
            var isAllowed = allowedNorm.has(normalizeAttrValKey(value));
            if (isAllowed) {
                btn.disabled = false;
                btn.classList.remove('disabled-option');
            } else {
                btn.disabled = true;
                btn.classList.add('disabled-option');
                if (btn.classList.contains('btn-dark')) {
                    btn.classList.remove('btn-dark');
                    if (!btn.classList.contains('btn-outline-dark')) {
                        btn.classList.add('btn-outline-dark');
                    }
                    if (selected[attrName] === value) {
                        delete selected[attrName];
                    }
                }
            }
        });
    }

    function initialiseSelectedFromDOM() {
        // No attributes: honour hidden variant ID or first variant
        if (!attributeGroups.length) {
            if (formVariantId) {
                var vid = parseInt(formVariantId.value || '0', 10);
                if (vid && variants.length) {
                    var found = variants.find(function(v){ return v.id === vid; });
                    if (found) {
                        applyVariant(found);
                        return;
                    }
                }
            }
            if (variants.length) {
                applyVariant(variants[0]);
            } else {
                applyVariant(null);
            }
            return;
        }

        // Preselect from server-rendered state (if any)
        selected = {};
        for (var i = 0; i < attributeGroups.length; i++) {
            var group = attributeGroups[i];
            var attrName = group.getAttribute('data-attribute-name');
            if (!attrName) continue;
            var selectedBtn = group.querySelector('.attribute-value-btn.btn-dark');
            if (selectedBtn && !selectedBtn.classList.contains('disabled-option')) {
                var value = selectedBtn.getAttribute('data-attribute-value');
                if (value) {
                    selected[attrName] = value;
                }
            }
        }

        // If server already provided a full valid path, just resolve that variant
        if (isFullSelection()) {
            var resolved = resolveVariantFromSelection();
            if (!resolved) resolved = resolveVariantFromDomIds();
            if (!resolved && formVariantId) {
                var vidInit = parseInt(formVariantId.value || '0', 10);
                if (vidInit) resolved = variants.find(function(v){ return v.id === vidInit; }) || null;
            }
            applyVariant(resolved);
            return;
        }

        // Otherwise, cascade from the first missing level
        var firstMissing = -1;
        for (var j = 0; j < attributeGroups.length; j++) {
            var g = attributeGroups[j];
            var name = g.getAttribute('data-attribute-name');
            if (!name || !selected[name]) {
                firstMissing = j;
                break;
            }
        }

        if (firstMissing === -1) {
            var fallback = resolveVariantFromSelection();
            if (!fallback) fallback = resolveVariantFromDomIds();
            if (!fallback && formVariantId) {
                var vidFb = parseInt(formVariantId.value || '0', 10);
                if (vidFb) fallback = variants.find(function(v){ return v.id === vidFb; }) || null;
            }
            applyVariant(fallback);
            return;
        }

        clearLowerSelections(firstMissing);
        cascadeFrom(firstMissing);
    }

    // Variant products only: attribute selection and initial variant state (simple products skip this)
    if (!isSimpleProduct) {
    // Attach click handlers for attribute buttons (respecting level order, premium cascading)
    if (attributeGroups.length) {
        attributeGroups.forEach(function(group, levelIndex){
            group.querySelectorAll('.attribute-value-btn').forEach(function(btn){
                btn.addEventListener('click', function(){
                    if (btn.disabled) return;
                    var groupEl = btn.closest('[data-attribute-name]');
                    if (!groupEl) return;
                    var attrName = groupEl.getAttribute('data-attribute-name');
                    if (!attrName) return;

                    // Visual selection within this group
                    groupEl.querySelectorAll('.attribute-value-btn').forEach(function(b){
                        b.classList.remove('btn-dark');
                        if (!b.classList.contains('disabled-option')) {
                            b.classList.add('btn-outline-dark');
                        }
                    });
                    btn.classList.remove('btn-outline-dark');
                    btn.classList.add('btn-dark');

                    var value = btn.getAttribute('data-attribute-value');
                    selected[attrName] = value;

                    // Clear all lower level selections
                    clearLowerSelections(levelIndex + 1);

                    // Premium cascading: auto-select children from next level downwards
                    cascadeFrom(levelIndex + 1);
                });
            });
        });
    }

    // Initial state for variant products
    initialiseSelectedFromDOM();
    }

    function _parseDateInput(val) {
        if (!val) return null;
        var d = new Date(val + 'T00:00:00');
        return isNaN(d.getTime()) ? null : d;
    }
    function _daysInclusive(a, b) {
        var ms = b.getTime() - a.getTime();
        return Math.floor(ms / (24 * 60 * 60 * 1000)) + 1;
    }
    function syncRentalPriceDisplay() {
        if (!rentalPriceLine) return;
        var sVal = rentalStart ? rentalStart.value : '';
        var eVal = rentalEnd ? rentalEnd.value : '';
        if (formRentalStart) formRentalStart.value = sVal || '';
        if (formRentalEnd) formRentalEnd.value = eVal || '';
        if (formRentalBilling) formRentalBilling.value = 'day';

        var s = _parseDateInput(sVal);
        var e = _parseDateInput(eVal);
        if (!s || !e) {
            rentalPriceLine.textContent = 'Select start and end dates to calculate rent.';
            if (formRentalUnits) formRentalUnits.value = '';
            return;
        }
        if (e.getTime() < s.getTime()) {
            rentalPriceLine.textContent = 'End date must be on or after start date.';
            if (formRentalUnits) formRentalUnits.value = '';
            return;
        }
        var days = _daysInclusive(s, e);
        if (formRentalUnits) formRentalUnits.value = String(days);

        var rate = parseFloat(rentalRates['day'] || '0');
        var total = (isNaN(rate) ? 0 : rate * days);
        rentalPriceLine.textContent = total > 0 ? ('Rent: Rs.' + total.toFixed(0) + ' for ' + days + ' day(s)') : '';
    }
    function setOfferMode(mode) {
        var isRent = mode === 'rental';
        if (offerModeRoot && offerModeRoot.getAttribute('data-rental-only') === 'true') isRent = true;
        if (offerModeRoot && offerModeRoot.getAttribute('data-purchase-only') === 'true') isRent = false;
        if (formLineType) formLineType.value = isRent ? 'rental' : 'purchase';
        if (formRentalBilling) {
            formRentalBilling.disabled = !isRent;
            if (!isRent) formRentalBilling.value = '';
        }
        if (formRentalUnits) {
            formRentalUnits.disabled = !isRent;
            if (!isRent) formRentalUnits.value = '';
        }
        if (rentalPanel) {
            var ro = offerModeRoot && offerModeRoot.getAttribute('data-rental-only') === 'true';
            var po = offerModeRoot && offerModeRoot.getAttribute('data-purchase-only') === 'true';
            rentalPanel.classList.toggle('d-none', po || (!isRent && !ro));
        }
        if (offerModeRoot && offerModeRoot.getAttribute('data-rental-only') === 'true') {
            if (formLineType) formLineType.value = 'rental';
            if (rentalPanel) rentalPanel.classList.remove('d-none');
        }
        if (offerModeRoot && offerModeRoot.getAttribute('data-purchase-only') === 'true') {
            if (formLineType) formLineType.value = 'purchase';
            if (rentalPanel) rentalPanel.classList.add('d-none');
        }
        if (isRent) syncRentalPriceDisplay();
    }
    if (offerModeRoot) {
        offerModeRoot.querySelectorAll('[data-mode]').forEach(function(btn){

                var mode = btn.getAttribute('data-mode');
                offerModeRoot.querySelectorAll('[data-mode]').forEach(function(b){ b.classList.remove('active'); });
                btn.classList.add('active');
                setOfferMode(mode);
            });
        });
    }
    if (rentalStart) rentalStart.addEventListener('change', syncRentalPriceDisplay);
    if (rentalEnd) rentalEnd.addEventListener('change', syncRentalPriceDisplay);

    if (offerModeRoot) {

        else if (offerModeRoot.getAttribute('data-purchase-only') === 'true') setOfferMode('purchase');

        if (!reviewForm || reviewForm.getAttribute('data-pdp-bound')) return;
        reviewForm.setAttribute('data-pdp-bound', '1');
        var stars = reviewForm.querySelectorAll('.star-btn');
        var ratingInput = document.getElementById('reviewRating');

                var hoverVal = parseInt(btn.getAttribute('data-value'), 10);
                stars.forEach(function(b){
                    b.style.color = parseInt(b.getAttribute('data-value'), 10) <= hoverVal ? '#f5a623' : '#ddd';
                });
            });
            btn.addEventListener('mouseleave', function(){
                var selectedVal = ratingInput.value ? parseInt(ratingInput.value, 10) : 0;
                stars.forEach(function(b){
                    b.style.color = parseInt(b.getAttribute('data-value'), 10) <= selectedVal ? '#f5a623' : '#ddd';
                });
            });
            btn.addEventListener('click', function(){
                var val = parseInt(btn.getAttribute('data-value'), 10);

                stars.forEach(function(b){
                    b.style.color = parseInt(b.getAttribute('data-value'), 10) <= val ? '#f5a623' : '#ddd';

            var submitBtn = document.getElementById('reviewSubmitBtn');

                method: 'POST',

                body: new FormData(reviewForm)
            })
            .then(function(r){ return r.json(); })
            .then(function(data){

                    submitBtn.textContent = 'Submit Review';

            .catch(function(){
                if (msg) {
                    msg.style.color = 'red';
                    msg.textContent = 'Network error. Please try again.';
                }
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Review';
            });

        fetch(src, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })

})();

(function () {
    var module = document.getElementById('pdpStateModule');
    if (!module) return;

    var tip = document.getElementById('pdpStateHint');
    var pid = window.productId || null;
    if (!tip || !pid) return;

    var REGION_ORDER = ['south','west','central','east','north','northeast','ut'];

    fetch('/api/delivery/states/?product_id=' + encodeURIComponent(pid), {
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
        .then(function (r) { return r.json(); })
        .then(function (data) {
            var states = data.states || [];
            if (!states.length) {
                module.hidden = true;
                return;
            }

            // Stable region order, deliverable states only
            var byRegion = {};
            states.forEach(function (s) {
                if (!byRegion[s.region]) byRegion[s.region] = [];
                byRegion[s.region].push(s);
            });
            var ordered = [];
            REGION_ORDER.forEach(function (region) {
                (byRegion[region] || []).forEach(function (s) { ordered.push(s); });
            });
            // Any unexpected region codes last
            states.forEach(function (s) {
                if (REGION_ORDER.indexOf(s.region) === -1) ordered.push(s);
            });

            tip.textContent = '';
            ordered.forEach(function (s) {
                var chip = document.createElement('span');
                chip.className = 'pdp-delivery-tip__chip';
                chip.textContent = s.code || s.name;
                chip.title = s.name;
                tip.appendChild(chip);
            });

            module.hidden = false;
        })
        .catch(function () {
            module.hidden = true;
        });
})();

(function () {
    var btn      = document.getElementById('pdpShareBtn');
    var overlay  = document.getElementById('pdpShareModal');
    var closeBtn = document.getElementById('pdpShareClose');
    if (!btn || !overlay) return;

    function getShareData() {
        var name  = btn.getAttribute('data-product-name') || document.title;
        var price = btn.getAttribute('data-product-price');
        var url   = window.location.href;
        var text  = price ? name + ' — ₹' + price + '\n' + url : name + '\n' + url;
        return { name: name, price: price, url: url, text: text };
    }

    function openSheet() {
        var d = getShareData();
        var enc = encodeURIComponent;
        document.getElementById('shareWhatsapp').href = 'https://wa.me/?text=' + enc(d.text);
        document.getElementById('shareFacebook').href = 'https://www.facebook.com/sharer/sharer.php?u=' + enc(d.url);
        document.getElementById('shareMail').href = 'mailto:?subject=' + enc(d.name) + '&body=' + enc(d.text);
        var smsBody = enc(d.text);
        document.getElementById('shareSMS').href = /iPhone|iPad|iPod/i.test(navigator.userAgent)
            ? 'sms:&body=' + smsBody : 'sms:?body=' + smsBody;
        overlay.classList.add('is-open');
        document.body.style.overflow = 'hidden';
    }

    function closeSheet() {
        overlay.classList.remove('is-open');
        document.body.style.overflow = '';
    }

    btn.addEventListener('click', function () {
        var d = getShareData();
        if (navigator.share) {
            navigator.share({ title: d.name, text: '₹' + (d.price || '') + ' — Check this out!', url: d.url })
                .catch(function () {});
            return;
        }
        openSheet();
    });

    closeBtn.addEventListener('click', closeSheet);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeSheet(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

    document.getElementById('shareCopy').addEventListener('click', function () {
        var d = getShareData();
        var label = document.getElementById('shareCopyLabel');
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(d.url).then(function () {
                label.textContent = 'Copied!';
                setTimeout(function () { label.textContent = 'Copy Link'; }, 2000);
            });
        } else {
            var ta = document.createElement('textarea');
            ta.value = d.url; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); label.textContent = 'Copied!'; } catch(e) {}
            document.body.removeChild(ta);
            setTimeout(function () { label.textContent = 'Copy Link'; }, 2000);
        }
    });

    var priceEl = document.getElementById('price-selling');
    if (priceEl) {
        new MutationObserver(function () {
            var raw = (priceEl.textContent || '').replace(/[^\d.]/g, '');
            if (raw) btn.setAttribute('data-product-price', raw);
        }).observe(priceEl, { childList: true, subtree: true, characterData: true });
    }
})();
</script>
