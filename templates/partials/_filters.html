
<aside id="filterOffcanvas" class="filter-offcanvas" role="dialog" aria-label="Filters">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h5 class="mb-0 fw-bold">Filters</h5>
        <button class="filter-close" id="filterCloseBtn" type="button" aria-label="Close">&times;</button>
    </div>
    <form method="get" action="{% url 'store:product_list' %}">
        <input type="hidden" name="sort" value="{{ filters.sort }}">
        <input type="hidden" name="q" value="{{ filters.q }}">
        {% if filters.combo %}<input type="hidden" name="combo" value="{{ filters.combo }}">{% endif %}
        <div class="filter-section">
            <h6>Category</h6>
            <select name="category" class="form-select mb-3">
                <option value="all" {% if filters.category == 'all' %}selected{% endif %}>All</option>
                {% for cat in categories %}
                <option value="{{ cat.slug }}" {% if filters.category == cat.slug %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
            </select>
            {% if child_categories %}
            <div class="filter-child-cats d-flex flex-wrap gap-2">
                {% for c in child_categories %}
                <a class="btn btn-sm btn-outline-dark"
                   href="{% url 'store:product_list' %}?category={{ c.slug }}{% if filters.sort %}&sort={{ filters.sort }}{% endif %}{% if filters.q %}&q={{ filters.q }}{% endif %}">
                    {{ c.name }}
                </a>
                {% endfor %}
            </div>
            {% endif %}
        </div>
        <div class="filter-section filter-section--price">
            <h6>Price</h6>
            <div class="filter-price-inputs">
                <input type="number" name="min_price" value="{{ filters.min_price }}" placeholder="Min" class="form-control mb-2" min="0" step="1">
                <input type="number" name="max_price" value="{{ filters.max_price }}" placeholder="Max" class="form-control mb-2" min="0" step="1">
            </div>
        </div>
        <div class="filter-actions">
            <button type="submit" class="btn btn-dark w-100">Apply</button>
        </div>
    </form>
</aside>
<div id="filterOverlay" class="filter-offcanvas-overlay"></div>
