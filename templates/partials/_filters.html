
<aside id="filterOffcanvas" class="filter-offcanvas" role="dialog" aria-label="Filters">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h5 class="mb-0 fw-bold">Filters</h5>
        <button class="filter-close" id="filterCloseBtn" type="button" aria-label="Close">&times;</button>
    </div>
    <form method="get" action="{% url 'store:product_list' %}">
        <input type="hidden" name="sort" value="{{ filters.sort }}">
        <input type="hidden" name="q" value="{{ filters.q }}">
        {% if filters.combo %}<input type="hidden" name="combo" value="{{ filters.combo }}">{% endif %}
        <div class="filter-section">
            <h6>Category</h6>
            <select name="category" class="form-select mb-3">
                <option value="all" {% if filters.category == 'all' %}selected{% endif %}>All</option>
                {% for cat in categories %}
                <option value="{{ cat.slug }}" {% if filters.category == cat.slug %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
                {% if selected_category and selected_category not in categories %}
                <option value="{{ selected_category.slug }}" selected>{{ selected_category.name }}</option>
                {% endif %}
            </select>
            {% if child_categories %}
            <div class="filter-child-cats d-flex flex-wrap gap-2">
                {% for c in child_categories %}
                <button type="button" class="btn btn-sm {% if filters.category == c.slug %}btn-dark active{% else %}btn-outline-dark{% endif %} filter-child-cat-btn" data-slug="{{ c.slug }}">
                    {{ c.name }}
                </button>
                {% endfor %}
            </div>
            <script>
                document.querySelectorAll('.filter-child-cat-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.filter-child-cat-btn').forEach(function(b) { 
                            b.classList.remove('btn-dark', 'active');
                            b.classList.add('btn-outline-dark');
                        });
                        this.classList.remove('btn-outline-dark');
                        this.classList.add('btn-dark', 'active');
                        var select = document.querySelector('select[name="category"]');
                        if (select) {
                            var option = Array.from(select.options).find(o => o.value === this.dataset.slug);
                            if (option) {
                                option.selected = true;
                            } else {
                                var newOption = new Option(this.textContent.trim(), this.dataset.slug, true, true);
                                select.add(newOption);
                            }
                        }
                    });
                });
            </script>
            {% endif %}
        </div>
        <div class="filter-section filter-section--price">
            <h6>Price</h6>
            <div class="filter-price-inputs">
                <input type="number" name="min_price" value="{{ filters.min_price }}" placeholder="Min" class="form-control mb-2" min="0" step="1">
                <input type="number" name="max_price" value="{{ filters.max_price }}" placeholder="Max" class="form-control mb-2" min="0" step="1">
            </div>
        </div>
        <div class="filter-section filter-section--offers">
            <h6>Special Offers</h6>
            <div class="form-check" style="margin-top: 0.5rem;">
                <input class="form-check-input" type="checkbox" name="offer" value="1" id="filterOfferCheck" {% if filters.offer == '1' %}checked{% endif %} style="cursor: pointer;">
                <label class="form-check-label" for="filterOfferCheck" style="cursor: pointer; user-select: none;">
                    Only show discounted products
                </label>
            </div>
        </div>
        <div class="filter-actions d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-dark w-100">Apply</button>
            <a href="{% url 'store:product_list' %}?{% if parent_category_slug %}category={{ parent_category_slug }}&{% endif %}{% if filters.combo %}combo={{ filters.combo }}{% endif %}" class="btn btn-outline-dark w-100">Clear</a>
        </div>
    </form>
</aside>
<div id="filterOverlay" class="filter-offcanvas-overlay"></div>
